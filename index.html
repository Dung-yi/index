<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作日誌</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#f3f5f8;
  color:#1f2937;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:none;
  margin:0;
  min-height:100vh;
}


/* =========================
   登入畫面
========================= */

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#172033,#34435e);
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:30px 24px;
  box-shadow:0 20px 50px #0004;
}

.auth-box h1{
  margin:0;
  font-size:26px;
  text-align:center;
}

.auth-subtitle{
  text-align:center;
  color:#6b7280;
  margin:8px 0 25px;
  font-size:14px;
}

.auth-group{
  margin-bottom:15px;
}

.auth-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.auth-group input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.auth-group input:focus{
  border-color:#2563eb;
}

.auth-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.auth-buttons button{
  flex:1;
}

.auth-message{
  min-height:20px;
  margin-top:15px;
  text-align:center;
  font-size:13px;
  color:#6b7280;
}

.auth-message.error{
  color:#dc2626;
}

.auth-message.success{
  color:#16a34a;
}


/* =========================
   Header
========================= */

.header{
  background:linear-gradient(135deg,#172033,#34435e);
  color:#fff;
  padding:22px 20px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:8px 0 0;
  color:#d7deea;
  font-size:14px;
}

.user-area{
  text-align:right;
  flex-shrink:0;
}

.user-email{
  font-size:12px;
  color:#d7deea;
  margin-bottom:6px;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-btn{
  border:1px solid #ffffff55;
  background:#ffffff12;
  color:#fff;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
}


/* =========================
   Search
========================= */

.workspace-layout{
  display:grid;
  grid-template-columns:clamp(156px,12vw,200px) minmax(0,1fr);
  gap:12px;
  padding-top:16px;
}

.workspace-main{
  min-width:0;
}

.workspace-sidebar{
  position:sticky;
  top:16px;
  align-self:start;
  padding-left:16px;
}

.workspace-sidebar h2{
  margin:0 0 10px;
  font-size:15px;
  color:#334155;
}

.status-menu{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.status-filter{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:44px;
  padding:11px 12px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  background:#fff;
  color:#334155;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
}

.status-filter[aria-pressed="true"]{
  outline:2px solid #2563eb;
  outline-offset:2px;
}

.status-filter:focus-visible{
  outline:3px solid #1e40af;
  outline-offset:3px;
}

.status-count{
  font-size:12px;
  opacity:.85;
}

.entry-head > .status-tag{
  flex-shrink:0;
  white-space:nowrap;
}

.entry-text{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.entry-title{
  display:inline;
}

.entry-labels{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-left:6px;
  vertical-align:middle;
}

.entry-labels .tag{
  font-size:12px;
  white-space:nowrap;
}

.status-tag[data-status="已完成"],
.status-filter[data-status-filter="已完成"]{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.status-tag[data-status="未處理"],
.status-filter[data-status-filter="未處理"]{
  background:#fee2e2;
  color:#991b1b;
  border-color:#fca5a5;
}

.status-tag[data-status="處理中"],
.status-filter[data-status-filter="處理中"]{
  background:#fef3c7;
  color:#92400e;
  border-color:#fcd34d;
}

@media(max-width:760px){
  .workspace-layout{
    grid-template-columns:minmax(0,1fr);
    padding-top:12px;
  }
  .workspace-sidebar{
    position:static;
    padding:0 16px;
  }
  .status-menu{
    flex-direction:row;
    flex-wrap:wrap;
  }
  .status-filter{
    flex:1 1 auto;
  }
  .entry-head{
    flex-wrap:wrap;
  }
}

.search{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #e5e7eb;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-input-wrap{
  position:relative;
  flex:1;
}

.search input{
  width:100%;
  padding:13px 16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:15px;
  outline:0;
}

.search input:focus{
  border-color:#2563eb;
}

.search select,
#searchDate{
  width:180px;
  padding:13px 12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:15px;
  background:#fff;
  outline:0;
  cursor:pointer;
}

#searchDate{
  width:160px;
}

.search select:focus,
#searchDate:focus{
  border-color:#2563eb;
}


/* =========================
   Toolbar
========================= */

.toolbar{
  display:flex;
  gap:10px;
  padding:16px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 16px;
  font-size:14px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:#fff;
  flex:1;
  font-weight:600;
}

.secondary{
  background:#fff;
  border:1px solid #d1d5db;
}

.import-btn{
  background:#ecfdf5;
  color:#047857;
  border:1px solid #a7f3d0;
}


/* =========================
   Stats
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:0 16px 16px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.num{
  font-size:22px;
  font-weight:700;
  color:#2563eb;
}

.label{
  font-size:12px;
  color:#6b7280;
  margin-top:4px;
}


/* =========================
   Content
========================= */

.content{
  padding:0 16px 100px;
}

.back-to-top{
  position:fixed;
  right:calc(24px + env(safe-area-inset-right, 0px));
  bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  width:52px;
  height:52px;
  padding:0;
  border:1px solid #1d4ed8;
  border-radius:18px;
  background:linear-gradient(145deg,#2563eb,#1d4ed8);
  color:#fff;
  box-shadow:0 6px 18px #1d4ed84d;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
}

.back-to-top:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 22px #1d4ed866;
}

.back-to-top:focus-visible{
  outline:3px solid #1e3a8a;
  outline-offset:4px;
}

.back-to-top svg{
  width:25px;
  height:25px;
}

@media(prefers-reduced-motion:reduce){
  .back-to-top{
    transition:none;
  }
  .back-to-top:hover{
    transform:none;
  }
}

.date-section{
  margin-bottom:20px;
}

.date-head{
  width:100%;
  text-align:left;
  font-family:inherit;
  color:inherit;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  padding:14px;
  background:#fff;
  border:1px solid #d1d5db;
  border-radius:12px;
  cursor:pointer;
  list-style:none;
}

.date-head::-webkit-details-marker{
  display:none;
}

.date-head::before{
  content:"▶";
  color:#475569;
  font-size:12px;
  flex-shrink:0;
  margin-top:5px;
}

.date-head[aria-expanded="true"]{
  margin-bottom:10px;
}

.date-head[aria-expanded="true"]::before{
  transform:rotate(90deg);
}

.date-head:hover{
  background:#f8fafc;
}

.date-head:focus-visible{
  outline:3px solid #2563eb;
  outline-offset:3px;
}

.date-summary{
  flex:1;
  min-width:0;
}

.date-heading{
  display:flex;
  align-items:center;
  gap:10px;
}

.date-head .date-label{
  font-size:18px;
  font-weight:700;
  margin:0;
  flex:1;
  min-width:0;
}

.date-head .badge{
  flex-shrink:0;
}

.badge{
  font-size:12px;
  background:#e8efff;
  color:#2563eb;
  padding:5px 9px;
  border-radius:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 2px 5px #00000008;
}

.work-entry{ padding:0; }

.entry-head{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px 14px;
  cursor:pointer;
  list-style:none;
  color:#1e3a8a;
  font-size:15px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.entry-head::-webkit-details-marker{ display:none; }

.entry-head::before{
  content:"▶";
  color:#475569;
  font-size:10px;
  flex-shrink:0;
}

.work-entry[open] > .entry-head::before{ transform:rotate(90deg); }

.entry-head:hover{
  background:#eff6ff;
  border-radius:12px;
}

.entry-head:focus-visible{
  outline:3px solid #2563eb;
  outline-offset:2px;
  border-radius:12px;
}

.work-entry:not([open]){
  background:transparent;
  border-color:transparent;
  box-shadow:none;
  margin-bottom:2px;
}

.work-entry:not([open]) > .entry-head{
  padding-top:6px;
  padding-bottom:6px;
}

.work-entry[open] > .entry-head{
  font-weight:700;
  border-bottom:1px solid #e5e7eb;
}

.entry-content{ padding:14px 16px 16px; }

.meta{
  font-size:12px;
  color:#6b7280;
  margin-bottom:8px;
}

.title{
  font-size:17px;
  font-weight:700;
  margin-bottom:9px;
}

.tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.tag{
  font-size:12px;
  font-weight:600;
  background:#f1f5f9;
  color:#334155;
  border:1px solid #cbd5e1;
  padding:5px 8px;
  border-radius:7px;
}

.tag[data-category="驗車"]{
  background:#dbeafe;
  color:#1e40af;
  border-color:#93c5fd;
}

.tag[data-category="eTAG"]{
  background:#dcfce7;
  color:#166534;
  border-color:#86efac;
}

.tag[data-category="加油卡"]{
  background:#ffedd5;
  color:#9a3412;
  border-color:#fdba74;
}

.tag[data-category="罰單"]{
  background:#fee2e2;
  color:#991b1b;
  border-color:#fca5a5;
}

.tag[data-category="保險"]{
  background:#f3e8ff;
  color:#6b21a8;
  border-color:#d8b4fe;
}

.tag[data-category="新購車"]{
  background:#ccfbf1;
  color:#115e59;
  border-color:#5eead4;
}

.tag[data-category="新租賃"]{
  background:#fce7f3;
  color:#9d174d;
  border-color:#f9a8d4;
}

.tag[data-category="報廢"]{
  background:#ede0d4;
  color:#5e3023;
  border-color:#cba88a;
}

.tag[data-category="停車費"]{
  background:#e0e7ff;
  color:#3730a3;
  border-color:#a5b4fc;
}

.tag[data-category="其他"]{
  background:#f1f5f9;
  color:#334155;
  border-color:#cbd5e1;
}


/* =========================
   工作內容
========================= */

.body{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.65;
  color:#4b5563;
  font-size:17px;
  width:100%;
  margin:0;
  text-align:left;
}


.keyword-highlight{
  background:#fde047;
  color:#111827;
  padding:1px 3px;
  border-radius:4px;
  font-weight:700;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px;
}

.edit{
  background:#eff6ff;
  color:#2563eb;
}

.del{
  background:#fff1f2;
  color:#dc2626;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#9ca3af;
}

.empty .icon{
  font-size:44px;
  margin-bottom:10px;
}


/* =========================
   Loading
========================= */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#6b7280;
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   Modal
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:10;
  padding:18px;
  align-items:center;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  background:#fff;
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:22px;
}

.modal h2{
  margin:0 0 18px;
}

.group{
  margin-bottom:14px;
}

.group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.group input,
.group select,
.group textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font:inherit;
  outline:0;
}

.group textarea{
  min-height:160px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
}


/* =========================
   Mobile
========================= */

@media(max-width:600px){

  .header-top{
    flex-direction:column;
  }

  .user-area{
    width:100%;
    text-align:left;
  }

  .user-email{
    max-width:100%;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .toolbar{
    flex-direction:column;
  }

  .primary{
    width:100%;
  }

  .auth-box{
    padding:25px 20px;
  }

  .search-row{
    flex-wrap:wrap;
  }

  .search-input-wrap{
    flex:1 1 100%;
  }

  .search select,
  #searchDate{
    flex:1;
    width:auto;
  }

  .body{
    font-size:17px;
    width:100%;
    margin:0;
    text-align:left;
  }

  .title{
    font-size:17px;
  }

}

</style>
</head>


<body>


<!-- =========================
     登入畫面
========================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-box">

    <h1>📋 每日工作日誌</h1>

    <div class="auth-subtitle">
      雲端工作日誌
    </div>

    <div class="auth-group">

      <label>📧 Email</label>

      <input
        type="email"
        id="authEmail"
        placeholder="請輸入 Email"
        autocomplete="email"
      >

    </div>


    <div class="auth-group">

      <label>🔐 密碼</label>

      <input
        type="password"
        id="authPassword"
        placeholder="請輸入密碼"
        autocomplete="current-password"
      >

    </div>


    <div class="auth-buttons">

      <button
        class="btn primary"
        id="loginBtn"
      >
        登入
      </button>

      <button
        class="btn secondary"
        id="registerBtn"
      >
        建立帳號
      </button>

    </div>


    <div
      id="authMessage"
      class="auth-message"
    ></div>

  </div>

</div>



<!-- =========================
     工作日誌主畫面
========================= -->

<div
  class="app"
  id="app"
  style="display:none;"
>

  <header class="header">

    <div class="header-top">

      <div>

        <h1>📋 每日工作日誌</h1>

        <p id="todayText"></p>

      </div>


      <div class="user-area">

        <div
          class="user-email"
          id="userEmail"
        ></div>

        <button
          class="logout-btn"
          id="logoutBtn"
        >
          登出
        </button>

      </div>

    </div>

  </header>

  <div class="workspace-layout">
    <aside class="workspace-sidebar" aria-label="依工作進度篩選">
      <h2>工作進度</h2>
      <nav class="status-menu" aria-label="工作進度">
        <button type="button" class="status-filter" data-status-filter=""
          aria-pressed="true">全部<span class="status-count">0</span></button>
        <button type="button" class="status-filter" data-status-filter="已完成"
          aria-pressed="false">已完成<span class="status-count">0</span></button>
        <button type="button" class="status-filter" data-status-filter="未處理"
          aria-pressed="false">未處理<span class="status-count">0</span></button>
        <button type="button" class="status-filter" data-status-filter="處理中"
          aria-pressed="false">處理中<span class="status-count">0</span></button>
      </nav>
    </aside>
    <div class="workspace-main">



  <!-- =========================
       搜尋
  ========================= -->

  <div class="search">

    <div class="search-row">

      <div class="search-input-wrap">

        <input
          id="searchInput"
          placeholder="🔍 搜尋日期、標題、工作內容..."
        >

      </div>


      <select id="searchCategory">

        <option value="">
          📂 全部分類
        </option>

        <option value="驗車">
          驗車
        </option>

        <option value="eTAG">
          eTAG
        </option>

        <option value="加油卡">
          加油卡
        </option>

        <option value="罰單">
          罰單
        </option>

        <option value="保險">
          保險
        </option>

        <option value="新購車">
          新購車
        </option>

        <option value="新租賃">
          新租賃
        </option>

        <option value="報廢">
          報廢
        </option>

        <option value="停車費">
          停車費
        </option>

        <option value="其他">
          其他
        </option>

      </select>


      <!-- 日期篩選 -->

      <input
        type="date"
        id="searchDate"
        title="選擇日期篩選"
      >

    </div>

  </div>



  <!-- =========================
       工具列
  ========================= -->

  <div class="toolbar">

    <button
      class="btn primary"
      id="addBtn"
    >
      ＋ 新增工作內容
    </button>


    <button
      class="btn secondary"
      id="todayBtn"
    >
      📅 今天
    </button>


    <button
      class="btn secondary"
      id="clearSearchBtn"
    >
      清除搜尋
    </button>


    <button
      class="btn import-btn"
      id="importBtn"
      style="display:none;"
    >
      ☁️ 匯入舊資料
    </button>

  </div>



  <!-- =========================
       統計
  ========================= -->

  <div class="stats">

    <div class="stat">

      <div
        class="num"
        id="total"
      >
        0
      </div>

      <div class="label">
        總紀錄
      </div>

    </div>


    <div class="stat">

      <div
        class="num"
        id="todayCount"
      >
        0
      </div>

      <div class="label">
        今日紀錄
      </div>

    </div>


    <div class="stat">

      <div
        class="num"
        id="dates"
      >
        0
      </div>

      <div class="label">
        紀錄日期
      </div>

    </div>

  </div>

/* =========================================================
   日期
========================================================= */

function getToday(){

  const d = new Date();

  return `${d.getFullYear()}-${String(
    d.getMonth()+1
  ).padStart(2,"0")}-${String(
    d.getDate()
  ).padStart(2,"0")}`;

}



function updateToday(){

  const d = new Date();

  const week = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
  ];

  todayText.textContent =
    `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 ・ 星期${week[d.getDay()]}`;

}



/* =========================================================
   Escape HTML
========================================================= */

function esc(value=""){

  return String(value).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}



/* =========================================================
   搜尋關鍵字反白
========================================================= */

function highlight(
  value="",
  keyword=""
){

  const text =
    esc(value);

  if(!keyword){

    return text;

  }


  const escapedKeyword =
    keyword.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );


  const regex =
    new RegExp(
      `(${escapedKeyword})`,
      "gi"
    );


  return text.replace(
    regex,
    '<mark class="keyword-highlight">$1</mark>'
  );

}



/* =========================================================
   日期格式
========================================================= */

function formatDate(value){

  const d =
    new Date(value + "T00:00:00");

  const week = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
  ];

  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 星期${week[d.getDay()]}`;

}

/* =========================================================
   載入雲端資料
========================================================= */

async function loadWorks(){

  content.innerHTML = `
    <div class="loading">

      <div class="spinner"></div>

      正在載入雲端工作紀錄...

    </div>
  `;


  const {
    data,

  } =
    await supabaseClient
      .from("work_diary")
      .select("*")
      .order(
        "work_date",
        {
          ascending:false
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    content.innerHTML = `

      <div class="empty">

        <div class="icon">

        </div>

        <div>
          載入資料失敗
        </div>

        <div style="margin-top:8px;font-size:13px;">
          ${esc(error.message)}

    `;

  works =

      item => ({

        id:item.id,

        date:item.work_date,

        title:item.title,

        category:item.category,

        status:normalizeStatus(item.status),

        content:item.content,

        createdAt:item.created_at

}



/* =========================================================
   Local Storage 舊資料檢查

function checkLocalData(){

    const oldData =
      JSON.parse(

/* =========================================================
   匯入舊資料
========================================================= */

async function importOldData(){

  if(!currentUser){

    return;

  }


  let oldData = [];


  try{

    oldData =
      JSON.parse(
        localStorage.getItem("workDiary") || "[]"
      );

  }catch(error){

    alert(
      "讀取舊資料失敗"
    );

    return;

  }


  if(
    !Array.isArray(oldData) ||
    oldData.length === 0
  ){

    alert(
      "沒有找到舊的工作紀錄"
    );

    return;

  }


  const ok =
    confirm(
      `找到 ${oldData.length} 筆舊工作紀錄。\n\n要把它們匯入 Supabase 雲端嗎？`
    );


  if(!ok){

    return;

  }


  importBtn.disabled = true;

  importBtn.textContent =
    "匯入中...";


  const rows =
    oldData
      .filter(
        x =>
          x.date &&
          x.title &&
          x.content
      )
      .map(
        x => ({

          user_id:
            currentUser.id,

          work_date:
            x.date,

          title:
            x.title,

          category:
            x.category || "其他",

          content:
            x.content

        })
      );


  if(rows.length === 0){

    alert(
      "舊資料沒有符合格式的紀錄。"
    );

    importBtn.disabled = false;

    checkLocalData();

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("work_diary")
      .insert(rows);


  if(error){

    console.error(error);

    alert(
      "匯入失敗：\n" +
      error.message
    );

    importBtn.disabled = false;

    checkLocalData();

    return;

  }


  alert(
    `成功匯入 ${rows.length} 筆工作紀錄！`
  );


  localStorage.removeItem(
    "workDiary"
  );


  importBtn.style.display =
    "none";


  await loadWorks();

}

async function saveWork(){

  if(!currentUser){

    alert(
      "請先登入"

    return;

  }


  const workDate =
    dateInput.value || getToday();

  const title =

  }

    document.getElementById(

  saveBtn.textContent =
    "儲存中...";


  let error = null;


  if(editingId !== null){

    const result =
      await supabaseClient
        .from("work_diary")
        .update({

          work_date:
            workDate,

          title:

          category:

            workContent

        })
        .eq(
          "id",
          editingId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    error =

  }else{

    const result =
      await supabaseClient
        .from("work_diary")
        .insert({

          user_id:
            currentUser.id,

          work_date:
            workDate,

          title:
            title,

            category,

          status:
            status,

          content:
            workContent

        });


    error =
      result.error;

  }


  saveBtn.disabled = false;

  saveBtn.textContent =

function showToday(){

    getToday();

  searchCategory.value =
    "";

  searchDate.value =
    "";

  render();

}



/* =========================================================
   清除搜尋
========================================================= */

function clearSearch(){

  selectedStatus = "";

  searchInput.value =
    "";

  searchCategory.value =
    "";

  searchDate.value =
    "";

  render();

}



/* =========================================================
   Render
========================================================= */

function render(){

  const keyword =
    searchInput.value.trim();

  const q =
    keyword.toLowerCase();


  const selectedCategory =
    searchCategory.value;


  const selectedDate =
    searchDate.value;

  const isSearching =
    Boolean(keyword || selectedCategory || selectedDate || selectedStatus);


  const filtered =
    works.filter(
      item => {

        if(selectedStatus && normalizeStatus(item.status) !== selectedStatus){
          return false;
        }

        /* -------------------------
           分類篩選
        ------------------------- */

        if(
          selectedCategory &&
          item.category !==
            selectedCategory
        ){

          return false;

        }


        /* -------------------------
           日期篩選
        ------------------------- */

        if(
          selectedDate &&
          item.date !==
            selectedDate
        ){

          return false;

        }


        /* -------------------------
           沒有關鍵字
        ------------------------- */

        if(!q){

          return true;

        }


        /* -------------------------
           關鍵字搜尋
        ------------------------- */

        return [

          item.date,

          item.title,

          item.category,

          item.content

        ]
        .join(" ")
        .toLowerCase()
        .includes(q);

      }
    );


  document.querySelectorAll("[data-status-filter]").forEach(button => {
    const status = button.dataset.statusFilter;
    button.setAttribute("aria-pressed", String(status === selectedStatus));
    button.querySelector(".status-count").textContent = status
      ? works.filter(item => normalizeStatus(item.status) === status).length
      : works.length;
  });

  /* =========================
     統計
  ========================= */

  total.textContent =
    works.length;


  todayCount.textContent =
    works.filter(
      item =>
        item.date ===
        getToday()
    ).length;


  dates.textContent =
    new Set(
      works.map(
        item =>
          item.date
      )
    ).size;



  /* =========================
     沒有結果
  ========================= */

  if(filtered.length === 0){

    let emptyText =
      "目前還沒有工作紀錄，按「新增工作內容」開始吧！";


    if(
      keyword ||
      selectedCategory ||
      selectedDate ||
      selectedStatus
    ){

      emptyText =
        "找不到符合的工作紀錄";

    }


    content.innerHTML = `

      <div class="empty">

        <div class="icon">
          📭
        </div>

        ${emptyText}

      </div>

    `;

    return;

  }



  /* =========================
     依日期分組
  ========================= */

  const groups = {};


  filtered.forEach(
    item => {

      if(!groups[item.date]){

        groups[item.date] = [];

      }

      groups[item.date].push(
        item
      );

    }
  );


  let html = "";


  const sortedDates =
    Object.keys(groups).sort((a,b) => b.localeCompare(a));

  sortedDates.forEach(
      (date, dateIndex) => {

        html += `

          <section class="date-section">
            <button type="button" class="date-head" data-date-toggle
              aria-expanded="${isSearching || dateIndex === 0}"
              title="點選展開或收合當日全部紀錄">
              <span class="date-summary">
                <span class="date-heading">
                  <span class="date-label">📅 ${formatDate(date)}</span>
                  <span class="badge">${groups[date].length} 筆</span>
                </span>
              </span>
            </button>

        `;


        groups[date].forEach(
          item => {

            let createdText =
              "";


            if(item.createdAt){

              try{

                createdText =
                  new Date(
                    item.createdAt
                  ).toLocaleString(
                    "zh-TW",
                    {
                      month:"numeric",
                      day:"numeric",
                      hour:"2-digit",
                      minute:"2-digit"
                    }
                  );

              }catch(error){

                createdText =
                  "";

              }

            }


            html += `

              <details class="card work-entry" ${isSearching || dateIndex === 0 ? "open" : ""}>
                <summary class="entry-head" title="點選標題展開或收合內容">
                  <span class="tag status-tag" data-status="${normalizeStatus(item.status)}">${normalizeStatus(item.status)}</span>
                  <span class="entry-text">
                    <span class="entry-title">${highlight(item.title || "未填標題", keyword)}</span><span class="entry-labels">
                      <span class="tag" data-category="${esc(item.category || "其他")}">${highlight(item.category || "其他", keyword)}</span>
                    </span>
                  </span>
                </summary>
                <div class="entry-content">


                <div class="meta">

                  ${
                    createdText
                    ? `建立於 ${esc(createdText)}`
                    : ""
                  }

                </div>







                <div class="body">${highlight(item.content, keyword)}</div>



                <div class="actions">

                  <button
                    class="btn edit"
                    onclick="openModal('${String(item.id)}')"
                  >
                    ✏️ 編輯
                  </button>


                  <button
                    class="btn del"
                    onclick="deleteWork('${String(item.id)}')"
                  >
                    🗑️ 刪除
                  </button>

                </div>


                </div>
              </details>

            `;

          }
        );


        html += `

          </section>

        `;

      }
    );


  content.innerHTML =
    html;

}



/* =========================================================
   Auth 狀態
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(session?.user){

      await showApp(
        session.user
      );

    }else{

      currentUser =
        null;

      works = [];


      app.style.display =
        "none";


      authScreen.style.display =
        "flex";

    }

  }
);



/* =========================================================
   初始檢查登入
========================================================= */

async function init(){

  updateToday();


  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(error){

    console.error(error);

    showAuthMessage(
      "讀取登入狀態失敗",
      "error"
    );

    return;

  }


  if(data.session?.user){

    await showApp(
      data.session.user
    );

  }else{

    authScreen.style.display =
      "flex";

    app.style.display =
      "none";

  }

}

/* 日期搜尋 */

// 搜尋與新增／編輯的日期欄位，點擊任一處都直接開啟日曆。
[searchDate, dateInput].forEach(dateField => {
  dateField.addEventListener("click", event => {
    if(typeof dateField.showPicker === "function"){
      try{
        dateField.showPicker();
        // 避免點擊日曆圖示時，瀏覽器再切換一次開關。
        event.preventDefault();
      }catch(error){
        // 不支援程式開啟日曆時，保留原生日期選擇操作。
      }
    }
  });
});

  "change",
  render

/* 工作進度篩選，可與關鍵字、分類及日期條件一起使用。 */

document.querySelector(".status-menu").addEventListener("click", event => {
  const button = event.target.closest("[data-status-filter]");
  if(!button) return;
  selectedStatus = button.dataset.statusFilter;
  render();
});


/* 日期控制整天展開／收合，標題則獨立控制單筆紀錄。 */

content.addEventListener("click", event => {
  const button = event.target.closest("[data-date-toggle]");
  if(!button || !content.contains(button)) return;
  const section = button.closest(".date-section");
  const entries = [...section.querySelectorAll(".work-entry")];
  const shouldOpen = !entries.some(entry => entry.open);
  entries.forEach(entry => { entry.open = shouldOpen; });
  button.setAttribute("aria-expanded", String(shouldOpen));
});

content.addEventListener("toggle", event => {
  if(!event.target.matches(".work-entry")) return;
  const section = event.target.closest(".date-section");
  const anyOpen = [...section.querySelectorAll(".work-entry")]
    .some(entry => entry.open);
  section.querySelector("[data-date-toggle]")
    .setAttribute("aria-expanded", String(anyOpen));
}, true);


/* 返回最上方 */

document.getElementById("backToTopBtn").addEventListener("click", () => {
  window.scrollTo({

    behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ? "instant"
      : "smooth"
  });
});

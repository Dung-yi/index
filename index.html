<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作日誌</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#f3f5f8;
  color:#1f2937;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

.app{
  max-width:980px;
  margin:auto;
  min-height:100vh;
}


/* =========================
   登入畫面
========================= */

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#172033,#34435e);
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:30px 24px;
  box-shadow:0 20px 50px #0004;
}

.auth-box h1{
  margin:0;
  font-size:26px;
  text-align:center;
}

.auth-subtitle{
  text-align:center;
  color:#6b7280;
  margin:8px 0 25px;
  font-size:14px;
}

.auth-group{
  margin-bottom:15px;
}

.auth-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.auth-group input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.auth-group input:focus{
  border-color:#2563eb;
}

.auth-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.auth-buttons button{
  flex:1;
}

.auth-message{
  min-height:20px;
  margin-top:15px;
  text-align:center;
  font-size:13px;
  color:#6b7280;
}

.auth-message.error{
  color:#dc2626;
}

.auth-message.success{
  color:#16a34a;
}


/* =========================
   Header
========================= */

.header{
  background:linear-gradient(135deg,#172033,#34435e);
  color:#fff;
  padding:22px 20px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:8px 0 0;
  color:#d7deea;
  font-size:14px;
}

.user-area{
  text-align:right;
  flex-shrink:0;
}

.user-email{
  font-size:12px;
  color:#d7deea;
  margin-bottom:6px;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-btn{
  border:1px solid #ffffff55;
  background:#ffffff12;
  color:#fff;
  border-radius:8px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
}


/* =========================
   Search
========================= */

.search{
  background:#fff;
  padding:16px;
  border-bottom:1px solid #e5e7eb;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-input-wrap{
  position:relative;
  flex:1;
}

.search input{
  width:100%;
  padding:13px 16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:15px;
  outline:0;
}

.search input:focus{
  border-color:#2563eb;
}

.search select,
#searchDate{
  width:180px;
  padding:13px 12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:15px;
  background:#fff;
  outline:0;
  cursor:pointer;
}

#searchDate{
  width:160px;
}

.search select:focus,
#searchDate:focus{
  border-color:#2563eb;
}


/* =========================
   Toolbar
========================= */

.toolbar{
  display:flex;
  gap:10px;
  padding:16px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 16px;
  font-size:14px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#2563eb;
  color:#fff;
  flex:1;
  font-weight:600;
}

.secondary{
  background:#fff;
  border:1px solid #d1d5db;
}

.import-btn{
  background:#ecfdf5;
  color:#047857;
  border:1px solid #a7f3d0;
}


/* =========================
   Stats
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:0 16px 16px;
}

.stat{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.num{
  font-size:22px;
  font-weight:700;
  color:#2563eb;
}

.label{
  font-size:12px;
  color:#6b7280;
  margin-top:4px;
}


/* =========================
   Content
========================= */

.content{
  padding:0 16px 40px;
}

.date-section{
  margin-bottom:20px;
}

.date-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.date-head h2{
  font-size:18px;
  margin:0;
}

.badge{
  font-size:12px;
  background:#e8efff;
  color:#2563eb;
  padding:5px 9px;
  border-radius:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 2px 5px #00000008;
}

.meta{
  font-size:12px;
  color:#6b7280;
  margin-bottom:8px;
}

.title{
  font-size:17px;
  font-weight:700;
  margin-bottom:9px;
}

.tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.tag{
  font-size:12px;
  background:#f1f5f9;
  padding:5px 8px;
  border-radius:7px;
}


/* =========================
   工作內容
========================= */

.body{
  white-space:pre-wrap;
  line-height:1.65;
  color:#4b5563;
  font-size:17px;
  width:90%;
  margin:0 auto;
}


.keyword-highlight{
  background:#fde047;
  color:#111827;
  padding:1px 3px;
  border-radius:4px;
  font-weight:700;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px;
}

.edit{
  background:#eff6ff;
  color:#2563eb;
}

.del{
  background:#fff1f2;
  color:#dc2626;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:#9ca3af;
}

.empty .icon{
  font-size:44px;
  margin-bottom:10px;
}


/* =========================
   Loading
========================= */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#6b7280;
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   Modal
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:10;
  padding:18px;
  align-items:center;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  background:#fff;
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  padding:22px;
}

.modal h2{
  margin:0 0 18px;
}

.group{
  margin-bottom:14px;
}

.group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.group input,
.group select,
.group textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font:inherit;
  outline:0;
}

.group textarea{
  min-height:160px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
}


/* =========================
   Mobile
========================= */

@media(max-width:600px){

  .header-top{
    flex-direction:column;
  }

  .user-area{
    width:100%;
    text-align:left;
  }

  .user-email{
    max-width:100%;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .toolbar{
    flex-direction:column;
  }

  .primary{
    width:100%;
  }

  .auth-box{
    padding:25px 20px;
  }

  .search-row{
    flex-wrap:wrap;
  }

  .search-input-wrap{
    flex:1 1 100%;
  }

  .search select,
  #searchDate{
    flex:1;
    width:auto;
  }

  .body{
    font-size:17px;
    width:90%;
    margin:0 auto;
  }

  .title{
    font-size:17px;
  }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================================
   Supabase 設定
========================================================= */

const SUPABASE_URL =
  "https://yftqcaupzjrwtntqxxfw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_o6G3PznegosN1WWYswC9mA_PPsFiMaP";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        autoRefreshToken:true,
        persistSession:true,
        detectSessionInUrl:true
      }
    }
  );



/* =========================================================
   全域變數
========================================================= */

let works = [];

let editingId = null;

let currentUser = null;



/* =========================================================
   DOM
========================================================= */

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const authEmail =
  document.getElementById("authEmail");

const authPassword =
  document.getElementById("authPassword");

const authMessage =
  document.getElementById("authMessage");

const loginBtn =
  document.getElementById("loginBtn");

const registerBtn =
  document.getElementById("registerBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const userEmail =
  document.getElementById("userEmail");

const searchInput =
  document.getElementById("searchInput");

const searchCategory =
  document.getElementById("searchCategory");

const searchDate =
  document.getElementById("searchDate");

const content =
  document.getElementById("content");

const total =
  document.getElementById("total");

const todayCount =
  document.getElementById("todayCount");

const dates =
  document.getElementById("dates");

  document.getElementById("todayText");

  document.getElementById("modalBg");

const modalTitle =
  document.getElementById("modalTitle");

const dateInput =
  document.getElementById("dateInput");

const titleInput =
  document.getElementById("titleInput");

const categoryInput =
  document.getElementById("categoryInput");

const contentInput =
  document.getElementById("contentInput");

const importBtn =
  document.getElementById("importBtn");



/* =========================================================
   日期
========================================================= */

function getToday(){

  const d = new Date();

  return `${d.getFullYear()}-${String(
    d.getMonth()+1
  ).padStart(2,"0")}-${String(
    d.getDate()
  ).padStart(2,"0")}`;

}



function updateToday(){

  const d = new Date();

  const week = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
  ];

  todayText.textContent =
    `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 ・ 星期${week[d.getDay()]}`;

}



/* =========================================================
   Escape HTML
========================================================= */

function esc(value=""){

  return String(value).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}



/* =========================================================
   搜尋關鍵字反白
========================================================= */

function highlight(
  value="",
  keyword=""
){

  const text =
    esc(value);

  if(!keyword){

    return text;

  }


  const escapedKeyword =
    keyword.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );


  const regex =
    new RegExp(
      `(${escapedKeyword})`,
      "gi"
    );


  return text.replace(
    regex,
    '<mark class="keyword-highlight">$1</mark>'
  );

}



/* =========================================================
   日期格式
========================================================= */

function formatDate(value){

  const d =
    new Date(value + "T00:00:00");

  const week = [
    "日",
    "一",
    "二",
    "三",
    "四",
    "五",
    "六"
  ];

  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 星期${week[d.getDay()]}`;

}



/* =========================================================
   登入訊息
========================================================= */

function showAuthMessage(
  message,
  type=""
){

  authMessage.textContent =
    message;

  authMessage.className =
    "auth-message " + type;

}



/* =========================================================
   登入
========================================================= */

async function login(){

  const email =
    authEmail.value.trim();

  const password =
    authPassword.value;


  if(!email || !password){

    showAuthMessage(
      "請輸入 Email 和密碼",
      "error"
    );

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "登入中...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  loginBtn.disabled = false;

  loginBtn.textContent =
    "登入";


  if(error){

    showAuthMessage(
      error.message,
      "error"
    );

    return;
  }


  if(data.user){

    showAuthMessage(
      "登入成功",
      "success"
    );

    await showApp(
      data.user
    );

  }

}



/* =========================================================
   建立帳號
========================================================= */

async function register(){

  const email =
    authEmail.value.trim();

  const password =
    authPassword.value;


  if(!email || !password){

    showAuthMessage(
      "請輸入 Email 和密碼",
      "error"
    );

    return;
  }


  if(password.length < 6){

    showAuthMessage(
      "密碼至少需要 6 個字元",
      "error"
    );

    return;
  }


  registerBtn.disabled = true;

  registerBtn.textContent =
    "建立中...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        emailRedirectTo:
          "https://dung-yi.github.io/Work/"
      }

    });


  registerBtn.disabled = false;

  registerBtn.textContent =
    "建立帳號";


  if(error){

    showAuthMessage(
      error.message,
      "error"
    );

    return;
  }


  if(data.session){

    showAuthMessage(
      "帳號建立成功，已登入",
      "success"
    );

    await showApp(
      data.user
    );

  }else{

    showAuthMessage(
      "帳號建立成功！請到 Email 收驗證信，再回來登入。",
      "success"
    );

  }

}



/* =========================================================
   登出
========================================================= */

async function logout(){

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    alert(
      "登出失敗：" +
      error.message
    );

    return;
  }


  works = [];

  currentUser = null;

  app.style.display =
    "none";

  authScreen.style.display =
    "flex";

  authPassword.value =
    "";

}



/* =========================================================
   顯示主畫面
========================================================= */

async function showApp(user){

  currentUser = user;

  authScreen.style.display =
    "none";

  app.style.display =
    "block";

  userEmail.textContent =
    user.email || "";

  updateToday();

  await loadWorks();

  checkLocalData();

}



/* =========================================================
   載入雲端資料
========================================================= */

async function loadWorks(){

  content.innerHTML = `
    <div class="loading">

      <div class="spinner"></div>

      正在載入雲端工作紀錄...

    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("work_diary")
      .select("*")
      .order(
        "work_date",
        {
          ascending:false
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    content.innerHTML = `

      <div class="empty">

        <div class="icon">
          ⚠️
        </div>

        <div>
          載入資料失敗
        </div>

        <div style="margin-top:8px;font-size:13px;">
          ${esc(error.message)}
        </div>

      </div>

    `;

    return;

  }


  works =
    (data || []).map(
      item => ({

        id:item.id,

        date:item.work_date,

        title:item.title,

        category:item.category,

        content:item.content,

        createdAt:item.created_at

      })
    );


  render();

}



/* =========================================================
   Local Storage 舊資料檢查
========================================================= */

function checkLocalData(){

  try{

    const oldData =
      JSON.parse(
        localStorage.getItem("workDiary") || "[]"
      );


    if(
      Array.isArray(oldData) &&
      oldData.length > 0
    ){

      importBtn.style.display =
        "block";

      importBtn.textContent =
        `☁️ 匯入舊資料 (${oldData.length})`;

    }else{

      importBtn.style.display =
        "none";

    }

  }catch(error){

    console.error(error);

    importBtn.style.display =
      "none";

  }

}



/* =========================================================
   匯入舊資料
========================================================= */

async function importOldData(){

  if(!currentUser){

    return;

  }


  let oldData = [];


  try{

    oldData =
      JSON.parse(
        localStorage.getItem("workDiary") || "[]"
      );

  }catch(error){

    alert(
      "讀取舊資料失敗"
    );

    return;

  }


  if(
    !Array.isArray(oldData) ||
    oldData.length === 0
  ){

    alert(
      "沒有找到舊的工作紀錄"
    );

    return;

  }


  const ok =
    confirm(
      `找到 ${oldData.length} 筆舊工作紀錄。\n\n要把它們匯入 Supabase 雲端嗎？`
    );


  if(!ok){

    return;

  }


  importBtn.disabled = true;

  importBtn.textContent =
    "匯入中...";


  const rows =
    oldData
      .filter(
        x =>
          x.date &&
          x.title &&
          x.content
      )
      .map(
        x => ({

          user_id:
            currentUser.id,

          work_date:
            x.date,

          title:
            x.title,

          category:
            x.category || "其他",

          content:
            x.content

        })
      );


  if(rows.length === 0){

    alert(
      "舊資料沒有符合格式的紀錄。"
    );

    importBtn.disabled = false;

    checkLocalData();

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("work_diary")
      .insert(rows);


  if(error){

    console.error(error);

    alert(
      "匯入失敗：\n" +
      error.message
    );

    importBtn.disabled = false;

    checkLocalData();

    return;

  }


  alert(
    `成功匯入 ${rows.length} 筆工作紀錄！`
  );


  localStorage.removeItem(
    "workDiary"
  );


  importBtn.style.display =
    "none";


  await loadWorks();

}



/* =========================================================
   開啟新增 / 編輯
========================================================= */

function openModal(id=null){

  editingId = id;


  if(id !== null){

    const item =
      works.find(
        x =>
          String(x.id) ===
          String(id)
      );


    if(!item){

      alert(
        "找不到這筆工作紀錄"
      );

      return;

    }


    modalTitle.textContent =
      "編輯工作內容";


    dateInput.value =
      item.date || getToday();


    titleInput.value =
      item.title || "";


    categoryInput.value =
      item.category || "其他";


    contentInput.value =
      item.content || "";


  }else{

    modalTitle.textContent =
      "新增工作內容";


    dateInput.value =
      getToday();


    titleInput.value =
      "";


    categoryInput.value =
      "驗車";


    contentInput.value =
      "";

  }


  modalBg.classList.add(
    "show"
  );

}



/* =========================================================
   關閉 Modal
========================================================= */

function closeModal(){

  modalBg.classList.remove(
    "show"
  );

  editingId = null;

}



/* =========================================================
   儲存工作
========================================================= */

async function saveWork(){

  if(!currentUser){

    alert(
      "請先登入"
    );

    return;

  }


  const workDate =
    dateInput.value;

  const title =
    titleInput.value.trim();

  const category =
    categoryInput.value;

  const workContent =
    contentInput.value.trim();


  if(
    !workDate ||
    !title ||
    !workContent
  ){

    alert(
      "請至少填寫日期、工作標題與工作內容"
    );

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled = true;

  saveBtn.textContent =
    "儲存中...";


  let error = null;


  if(editingId !== null){

    const result =
      await supabaseClient
        .from("work_diary")
        .update({

          work_date:
            workDate,

          title:
            title,

          category:
            category,

          content:
            workContent

        })
        .eq(
          "id",
          editingId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    error =
      result.error;


  }else{

    const result =
      await supabaseClient
        .from("work_diary")
        .insert({

          user_id:
            currentUser.id,

          work_date:
            workDate,

          title:
            title,

          category:
            category,

          content:
            workContent

        });


    error =
      result.error;

  }


  saveBtn.disabled = false;

  saveBtn.textContent =
    "儲存紀錄";


  if(error){

    console.error(error);

    alert(
      "儲存失敗：\n" +
      error.message
    );

    return;

  }


  closeModal();

  await loadWorks();

}



/* =========================================================
   刪除
========================================================= */

async function deleteWork(id){

  if(!currentUser){

    return;

  }


  const ok =
    confirm(
      "確定要刪除這筆紀錄嗎？"
    );


  if(!ok){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("work_diary")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(error){

    console.error(error);

    alert(
      "刪除失敗：\n" +
      error.message
    );

    return;

  }


  await loadWorks();

}



/* =========================================================
   今天
========================================================= */

function showToday(){

  searchInput.value =
    getToday();

  searchCategory.value =
    "";

  searchDate.value =
    "";

  render();

}



/* =========================================================
   清除搜尋
========================================================= */

function clearSearch(){

  searchInput.value =
    "";

  searchCategory.value =
    "";

  searchDate.value =
    "";

  render();

}



/* =========================================================
   Render
========================================================= */

function render(){

  const keyword =
    searchInput.value.trim();

  const q =
    keyword.toLowerCase();


  const selectedCategory =
    searchCategory.value;


  const selectedDate =
    searchDate.value;


  const filtered =
    works.filter(
      item => {

        /* -------------------------
           分類篩選
        ------------------------- */

        if(
          selectedCategory &&
          item.category !==
            selectedCategory
        ){

          return false;

        }


        /* -------------------------
           日期篩選
        ------------------------- */

        if(
          selectedDate &&
          item.date !==
            selectedDate
        ){

          return false;

        }


        /* -------------------------
           沒有關鍵字
        ------------------------- */

        if(!q){

          return true;

        }


        /* -------------------------
           關鍵字搜尋
        ------------------------- */

        return [

          item.date,

          item.title,

          item.category,

          item.content

        ]
        .join(" ")
        .toLowerCase()
        .includes(q);

      }
    );


  /* =========================
     統計
  ========================= */

  total.textContent =
    works.length;


  todayCount.textContent =
    works.filter(
      item =>
        item.date ===
        getToday()
    ).length;


  dates.textContent =
    new Set(
      works.map(
        item =>
          item.date
      )
    ).size;



  /* =========================
     沒有結果
  ========================= */

  if(filtered.length === 0){

    let emptyText =
      "目前還沒有工作紀錄，按「新增工作內容」開始吧！";


    if(
      keyword ||
      selectedCategory ||
      selectedDate
    ){

      emptyText =
        "找不到符合的工作紀錄";

    }


    content.innerHTML = `

      <div class="empty">

        <div class="icon">
          📭
        </div>

        ${emptyText}

      </div>

    `;

    return;

  }



  /* =========================
     依日期分組
  ========================= */

  const groups = {};


  filtered.forEach(
    item => {

      if(!groups[item.date]){

        groups[item.date] = [];

      }

      groups[item.date].push(
        item
      );

    }
  );


  let html = "";


  Object.keys(groups)
    .sort(
      (a,b) =>
        b.localeCompare(a)
    )
    .forEach(
      date => {

        html += `

          <section class="date-section">

            <div class="date-head">

              <h2>
                📅 ${formatDate(date)}
              </h2>

              <span class="badge">
                ${groups[date].length} 筆
              </span>

            </div>

        `;


        groups[date].forEach(
          item => {

            let createdText =
              "";


            if(item.createdAt){

              try{

                createdText =
                  new Date(
                    item.createdAt
                  ).toLocaleString(
                    "zh-TW",
                    {
                      month:"numeric",
                      day:"numeric",
                      hour:"2-digit",
                      minute:"2-digit"
                    }
                  );

              }catch(error){

                createdText =
                  "";

              }

            }


            html += `

              <article class="card">


                <div class="meta">

                  ${
                    createdText
                    ? `建立於 ${esc(createdText)}`
                    : ""
                  }

                </div>



                <div class="title">

                  ${highlight(
                    item.title,
                    keyword
                  )}

                </div>



                <div class="tags">

                  <span class="tag">

                    ${highlight(
                      item.category || "其他",
                      keyword
                    )}

                  </span>

                </div>



                <div class="body">

                  ${highlight(
                    item.content,
                    keyword
                  )}

                </div>



                <div class="actions">

                  <button
                    class="btn edit"
                    onclick="openModal('${String(item.id)}')"
                  >
                    ✏️ 編輯
                  </button>


                  <button
                    class="btn del"
                    onclick="deleteWork('${String(item.id)}')"
                  >
                    🗑️ 刪除
                  </button>

                </div>


              </article>

            `;

          }
        );


        html += `

          </section>

        `;

      }
    );


  content.innerHTML =
    html;

}



/* =========================================================
   Auth 狀態
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if(session?.user){

      await showApp(
        session.user
      );

    }else{

      currentUser =
        null;

      works = [];


      app.style.display =
        "none";


      authScreen.style.display =
        "flex";

    }

  }
);



/* =========================================================
   初始檢查登入
========================================================= */

async function init(){

  updateToday();


  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(error){

    console.error(error);

    showAuthMessage(
      "讀取登入狀態失敗",
      "error"
    );

    return;

  }


  if(data.session?.user){

    await showApp(
      data.session.user
    );

  }else{

    authScreen.style.display =
      "flex";

    app.style.display =
      "none";

  }

}

registerBtn.addEventListener(

  );

  .getElementById("cancelModalBtn")

  );

  .getElementById("saveBtn")
  .addEventListener(

  );


importBtn.addEventListener(

);

searchInput.addEventListener(
  "input",
  render
);


/* 分類搜尋 */

searchCategory.addEventListener(
  "change",
  render
);

searchDate.addEventListener(
  "change",
  render
);

modalBg.addEventListener(

  event => {

    if(
      event.target ===

    ){

  }
);

authPassword.addEventListener(

  event => {

    if(
      event.key ===

    ){

    }

  }
);


/* 啟動 */

init();
